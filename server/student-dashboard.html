<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>학교 이메일 수집 시험</title><link rel="stylesheet" href="/dashboard.css"><body><main><h1>학교 이메일 수집 시험</h1><p class="notice">이메일은 확장이 보낸 값입니다. 학생 신원과 기기 정보는 서버가 인증한 정보가 아닙니다. 시험 계정 2~3명·지정 ChromeOS 기기에서 10분 시험용입니다.</p><button id="start">10분 수집 시험 시작</button> <button id="stop">시험 중지</button> <button id="refresh">새로고침</button><p id="message" role="status"></p><h2>계정별 연결 상태</h2><div class="scroll"><table><thead><tr><th>Chrome 이메일 (인증 안 됨)</th><th>기기 확인</th><th>버전</th><th>마지막 연결</th><th>지연</th></tr></thead><tbody id="statuses"></tbody></table></div><h2>방문·검색 시험 기록</h2><p>주소는 쿼리·fragment를 제외하고, 지원 검색 사이트의 검색어만 별도 표시합니다. 최근 1일 기록이며 세션 ID 대신 이메일로 표시합니다.</p><div class="scroll"><table><thead><tr><th>Chrome 이메일 (인증 안 됨)</th><th>시각</th><th>방문 URL</th><th>검색어</th></tr></thead><tbody id="events"></tbody></table></div></main><script src="/student-dashboard.js" defer></script></body></html>
