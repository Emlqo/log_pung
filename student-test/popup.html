<!doctype html><html lang="ko"><meta charset="utf-8"><link rel="stylesheet" href="popup.css"><title>학교 이메일 수집 시험</title><body><h1>학교 이메일 수집 시험</h1><p class="notice">교사가 수집 ON으로 켠 동안 정책으로 설치된 기기의 새 방문 URL·지원 검색어를 시험 서버에 전송합니다. Chrome 이메일은 인증되지 않은 정보입니다.</p><p>설치된 Chrome 프로필의 일반 탭이 대상입니다. 일반 주소의 쿼리·fragment, 이전 방문기록, 페이지 내용은 수집하지 않습니다. 교사가 OFF로 바꾸면 새 방문·검색 수집을 중지합니다.</p><div id="state" role="status"></div><button id="refresh">상태 확인</button><script src="student-test/src/popup.js" type="module"></script></body></html>
